
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireSim Testing Lab</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #171b20;
    color: #f1f3f5;
    font-family: Arial, sans-serif;
}

header {
    max-width: 1000px;
    margin: auto;
}

h1 {
    color: #e34b3d;
    margin-bottom: 5px;
}

.subtitle {
    color: #aab2bd;
}

main {
    max-width: 1000px;
    margin: 25px auto;
}

.panel {
    background: #242a32;
    border: 1px solid #39424d;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 18px;
}

.tools {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 12px;
}

button {
    border: 1px solid #56616e;
    border-radius: 6px;
    padding: 10px 14px;
    background: #343d48;
    color: white;
    cursor: pointer;
}

button:hover {
    border-color: #e34b3d;
}

button.active {
    background: #9e3029;
    border-color: #e34b3d;
}

#grid {
    display: grid;
    grid-template-columns: repeat(20, minmax(0, 1fr));
    gap: 2px;
    width: 100%;
    background: #111519;
    padding: 5px;
    border-radius: 6px;
}

.cell {
    aspect-ratio: 1;
    min-width: 0;
    background: #343d48;
    cursor: crosshair;
    border-radius: 2px;
}

.cell:hover {
    outline: 2px solid white;
    z-index: 1;
}

.grass { background: #557d42; }
.wood { background: #966037; }
.concrete { background: #92999e; }
.water { background: #287db5; }
.empty { background: #343d48; }

#status {
    color: #aab2bd;
    margin-top: 12px;
    font-size: 14px;
}

@media (max-width: 600px) {
    body {
        padding: 12px;
    }

    #grid {
        grid-template-columns: repeat(14, minmax(0, 1fr));
    }

    button {
        flex: 1;
    }
}
</style>
</head>

<body>

<header>
    <h1>FireSim</h1>
    <div class="subtitle">
        East Tennessee Fire Simulation Testing Lab
    </div>
</header>

<main>

    <section class="panel">
        <h2>Material Selection</h2>
        <p>Select a material, then click cells to paint the simulation grid.</p>

        <div class="tools">
            <button class="active" data-material="empty">Empty</button>
            <button data-material="grass">Grass</button>
            <button data-material="wood">Wood</button>
            <button data-material="concrete">Concrete</button>
            <button data-material="water">Water</button>
        </div>
    </section>

    <section class="panel">
        <h2>Simulation Grid</h2>
        <div id="grid"></div>

        <div id="status">
            Selected material: Empty
        </div>

        <div class="tools">
            <button id="clear">Clear Grid</button>
        </div>
    </section>

</main>

<script>
const grid = document.getElementById("grid");
const status = document.getElementById("status");

const width = 20;
const height = 14;

let selectedMaterial = "empty";

function createGrid() {
    grid.innerHTML = "";

    for (let i = 0; i < width * height; i++) {
        const cell = document.createElement("div");

        cell.className = "cell empty";
        cell.dataset.material = "empty";

        cell.addEventListener("click", () => {
            cell.className = "cell " + selectedMaterial;
            cell.dataset.material = selectedMaterial;
        });

        grid.appendChild(cell);
    }
}

document.querySelectorAll("[data-material]").forEach(button => {
    button.addEventListener("click", () => {
        selectedMaterial = button.dataset.material;

        document.querySelectorAll("[data-material]").forEach(item => {
            item.classList.remove("active");
        });

        button.classList.add("active");

        status.textContent =
            "Selected material: " +
            selectedMaterial.charAt(0).toUpperCase() +
            selectedMaterial.slice(1);
    });
});

document.getElementById("clear").addEventListener("click", () => {
    createGrid();
});

createGrid();
</script>

</body>
</html>
